[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clawbot-harness"
version = "0.2.0"
description = "A portable AI harness with LangGraph-powered skills and cross-model support"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "langchain>=0.1.0",
    "langgraph>=0.0.20",
    "langchain-openai>=0.0.5",
    "langchain-anthropic>=0.1.0",
    "chromadb>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
all = [
    "langchain-community>=0.0.10",
]

[project.scripts]
clawbot = "clawbot.__main__:main"

[tool.setuptools.packages.find]
include = ["clawbot*"]
